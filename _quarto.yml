project:
  type: website
  resources:
    - CNAME

lang: en

website:
  title: "MELANOBS"
  site-url: https://melanobs.net
  favicon: images/favicon.png
  description: "MELANOBS, the Melanesian Observatory of forest responses to global change: a regional network of permanent forest plots and herbaria in Melanesia."
  image: images/home-banner.jpg
  open-graph: true
  twitter-card: true
  navbar:
    background: primary
    left:
      - text: "About"
        href: about.qmd
      - text: "Permanent plots"
        href: plots.qmd
      - text: "Herbaria"
        href: herbaria.qmd
      - text: "News"
        href: news.qmd
      - text: "Data"
        href: data.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Contact"
        href: contact.qmd
    right:
      - text: "Français"
        href: fr/index.qmd
  page-footer:
    left: "MELANOBS · Melanesian Observatory of forest responses to global change"
    right: |
      <div class="footer-logos">
      <a href="https://amaplab.fr"><img src="/images/amap.png" alt="AMAP lab"></a>
      <a href="https://en.ird.fr"><img src="/images/ird.png" alt="IRD"></a>
      <img src="/images/fonds-pacifique.png" alt="Pacific Fund">
      </div>

format:
  html:
    theme: [default, styles.scss]
    toc: false

execute:
  freeze: auto
